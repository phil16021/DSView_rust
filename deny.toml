# cargo-deny: licenses must be compatible with DSView's GPL-3.0-or-later,
# no known-vulnerable or yanked crates, crates only from crates.io.

[graph]
all-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "OFL-1.1",
    # egui's built-in Ubuntu font (epaint_default_fonts)
    "Ubuntu-font-1.0",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9
# The allowlist anticipates later phases; unused entries are fine.
unused-allowed-license = "allow"

[advisories]
yanked = "deny"
# Informational "unmaintained" notices (2026-10-16): zbus_names, zvariant and
# zvariant_derive were merged into zbus 6. They come from eframe 0.37's
# AccessKit bridge (accesskit_unix -> atspi -> zbus 5); they go away with an
# egui release on zbus 6.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zbus 5 split crate, merged into zbus 6; via eframe 0.37 / AccessKit" },
    { id = "RUSTSEC-2026-0371", reason = "zbus 5 split crate, merged into zbus 6; via eframe 0.37 / AccessKit" },
    { id = "RUSTSEC-2026-0372", reason = "zbus 5 split crate, merged into zbus 6; via eframe 0.37 / AccessKit" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
