test = false
doc = false
bench = false

[[bin]]
name = "usb_header"
path = "fuzz_targets/usb_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dso_status_block"
path = "fuzz_targets/dso_status_block.rs"
test = false
doc = false
