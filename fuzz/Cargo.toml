[package]
name = "dsview-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
dsview-formats = { path = "../crates/dsview-formats" }
dsview-store = { path = "../crates/dsview-store" }

[[bin]]
name = "header"
path = "fuzz_targets/header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dsl_reader"
path = "fuzz_targets/dsl_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stores"
path = "fuzz_targets/stores.rs"
test = false
doc = false
bench = false

# Not part of the main workspace (needs nightly + sanitizers).
[workspace]
