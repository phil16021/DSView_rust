[package]
name = "dsview-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
dsview-control = { path = "../crates/dsview-control", default-features = false }
dsview-core = { path = "../crates/dsview-core" }
dsview-decode = { path = "../crates/dsview-decode" }
dsview-drivers = { path = "../crates/dsview-drivers" }
dsview-formats = { path = "../crates/dsview-formats" }
dsview-session = { path = "../crates/dsview-session" }
dsview-store = { path = "../crates/dsview-store" }
dsview-usb = { path = "../crates/dsview-usb", default-features = false }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[[bin]]
name = "header"
path = "fuzz_targets/header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dsl_reader"
path = "fuzz_targets/dsl_reader.rs"
test = false
doc = false
bench = false

