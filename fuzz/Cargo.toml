[[bin]]
name = "dsc_json"
path = "fuzz_targets/dsc_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decoders_json"
path = "fuzz_targets/decoders_json.rs"
test = false
doc = false
bench = false

[[bin]]
