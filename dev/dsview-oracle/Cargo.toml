[package]
name = "dsview-oracle"
version = "0.1.0"
description = "Builds the original C libraries and runs them as the golden reference for the Rust port"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dsview-core = { path = "../../crates/dsview-core" }
dsview-decode = { path = "../../crates/dsview-decode" }
dsview-drivers = { path = "../../crates/dsview-drivers" }
# the C build has DSVIEW_RUST_CORE set: rs_driver.c etc. call into dsv_*
dsview-ffi = { path = "../../crates/dsview-ffi" }
dsview-formats = { path = "../../crates/dsview-formats" }
anyhow.workspace = true
serde_json.workspace = true
sha2.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
dsview-store = { path = "../../crates/dsview-store" }
proptest = "1"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[[bench]]
name = "store"
harness = false
