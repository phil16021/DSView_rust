# Generates include/dsview_ffi.h: `cargo xtask gen-header` (CI checks it is current).
language = "C"
include_guard = "DSVIEW_FFI_H"
cpp_compat = true
autogen_warning = "/* Generated by cbindgen from crates/dsview-ffi; do not edit. Regenerate with `cargo xtask gen-header`. */"
header = "/* C ABI of the Rust DSView core (crates/dsview-ffi). */"
usize_is_size_t = true

[export]
prefix = ""
include = ["DsvDslHeader", "DsvDslChannel", "DsvExportChannel", "DsvExportPacket"]

[export.rename]
"DsvDsl" = "dsv_dsl"
"DsvDslHeader" = "dsv_dsl_header_info"
"DsvDslChannel" = "dsv_dsl_channel_info"
"DsvExport" = "dsv_export"
"DsvZipWriter" = "dsv_zip_writer"
"DsvExportChannel" = "dsv_export_channel"
"DsvExportPacket" = "dsv_export_packet"

[enum]
prefix_with_name = true

[defines]
