# Generates include/dsview_ffi.h: `cargo xtask gen-header` (CI checks it is current).
language = "C"
include_guard = "DSVIEW_FFI_H"
cpp_compat = true
autogen_warning = "/* Generated by cbindgen from crates/dsview-ffi; do not edit. Regenerate with `cargo xtask gen-header`. */"
header = "/* C ABI of the Rust DSView core (crates/dsview-ffi). */"
usize_is_size_t = true

[export]
prefix = ""
include = ["DsvDslHeader", "DsvDslChannel", "DsvExportChannel", "DsvExportPacket", "DsvLogicCounts", "DsvDsoCounts", "DsvAnalogCounts", "DsvEnvelopeSection", "DsvDsoEnvSection", "DsvValue", "DsvStrList", "DsvChannelMeta", "DsvOptionMeta", "DsvRowMeta", "DsvDecoderMeta", "DsvDecodeEvent", "DsvConf", "DsvDevInfo", "DsvChannel", "DsvPacket", "DsvUsbLocation", "DsvLibHost", "DsvLibEntry"]

[export.rename]
"DsvDsl" = "dsv_dsl"
"DsvDslHeader" = "dsv_dsl_header_info"
"DsvDslChannel" = "dsv_dsl_channel_info"
"DsvExport" = "dsv_export"
"DsvZipWriter" = "dsv_zip_writer"
"DsvExportChannel" = "dsv_export_channel"
"DsvExportPacket" = "dsv_export_packet"
"DsvLogicStore" = "dsv_logic_store"
"DsvLogicCounts" = "dsv_logic_counts"
"DsvDsoStore" = "dsv_dso_store"
"DsvAnalogStore" = "dsv_analog_store"
"DsvDsoCounts" = "dsv_dso_counts"
"DsvDsoEnvSection" = "dsv_dso_env_section"
"DsvAnalogCounts" = "dsv_analog_counts"
"DsvEnvelopeSection" = "dsv_envelope_section"
"DsvValue" = "dsv_value"
"DsvStrList" = "dsv_str_list"
"DsvChannelMeta" = "dsv_channel_meta"
"DsvOptionMeta" = "dsv_option_meta"
"DsvRowMeta" = "dsv_row_meta"
"DsvDecoderMeta" = "dsv_decoder_meta"
"DsvDecodeEvent" = "dsv_decode_event"
"DsvDecodeSession" = "dsv_decode_session"
"DsvDecodeInst" = "dsv_decode_inst"
"DsvDevice" = "dsv_device"
"DsvConf" = "dsv_conf"
"DsvDevInfo" = "dsv_dev_info"
"DsvChannel" = "dsv_channel"
"DsvPacket" = "dsv_packet"
"DsvEmit" = "dsv_emit"
"DsvUsbLocation" = "dsv_usb_location"
"DsvLibHost" = "dsv_lib_host"
"DsvLibEntry" = "dsv_lib_entry"

[enum]
prefix_with_name = true

