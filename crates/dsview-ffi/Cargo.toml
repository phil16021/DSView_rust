[package]
name = "dsview-ffi"
version.workspace = true
description = "C ABI of the Rust DSView core for the transitional Qt GUI"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
dsview-core = { path = "../dsview-core" }
dsview-decode = { path = "../dsview-decode" }
dsview-drivers = { path = "../dsview-drivers" }
dsview-formats = { path = "../dsview-formats" }
dsview-session = { path = "../dsview-session" }
dsview-store = { path = "../dsview-store" }
dsview-usb = { path = "../dsview-usb" }
