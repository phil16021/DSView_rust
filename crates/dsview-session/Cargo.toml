[package]
name = "dsview-session"
version.workspace = true
description = "Device list, activation, hotplug and the capture loop (libsigrok4DSL lib_main.c and session.c)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dsview-core = { path = "../dsview-core" }
dsview-drivers = { path = "../dsview-drivers" }
dsview-usb = { path = "../dsview-usb", default-features = false }
dsview-decode = { path = "../dsview-decode" }
dsview-formats = { path = "../dsview-formats" }
dsview-store = { path = "../dsview-store" }
serde_json.workspace = true
libc = "0.2"
serde = "1"

[dev-dependencies]
# the examples drive real devices
dsview-usb = { path = "../dsview-usb" }
zip = { version = "9", default-features = false, features = ["deflate"] }
