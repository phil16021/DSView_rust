[package]
name = "dsview-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "MCP server that drives a running DSView (logic analyzer / oscilloscope) over its local control socket"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1"
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync"] }

[profile.release]
strip = true
