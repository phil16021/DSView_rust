name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (deb + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git pkg-config \
            qt6-base-dev libqt6svg6-dev libgl1-mesa-dev libxkbcommon-dev libvulkan-dev \
            libglib2.0-dev zlib1g-dev libusb-1.0-0-dev libboost-dev libfftw3-dev \
            python3-dev libudev-dev dpkg-dev rsync patchelf

      # Release R1: the Rust GUI installs as DSView, the Qt GUI as DSView-qt
      # (running on the Rust core by default), and dsview-cli next to them.
      # The toolchain comes from rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup show

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCPACK_PACKAGE_CONTACT="pat.felix92@gmail.com" \
            -DCPACK_DEBIAN_PACKAGE_SHLIBDEPS=ON

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Build .deb package
        run: |
          cd build
          cpack -G DEB

      # DSView embeds Python for its protocol decoders and links the exact
      # libpythonX.Y the runner has (Ubuntu 22.04: 3.10), which newer
      # releases do not ship. The package carries that libpython and its
      # standard library in /usr/lib/dsview instead.
      - name: Bundle Python into the .deb
        run: tools/package/deb.sh build/*.deb python3

      - name: Check the .deb on clean systems
        run: tools/package/check-deb.sh build ubuntu:22.04 ubuntu:24.04 ubuntu:26.04

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v6
        with:
          name: DSView-linux-deb
          path: build/*.deb

      - name: Install into AppDir
        run: |
          rm -rf AppDir
          DESTDIR="${GITHUB_WORKSPACE}/AppDir" cmake --install build
          # the AppImage starts the Rust GUI; the Qt one with --qt (AppRun)
          rm -f AppDir/usr/share/applications/dsview-qt.desktop

      - name: Download linuxdeploy
        run: |
          # linuxdeployqt (previously used here) has a regression in its
          # current "continuous" build: it silently omits libQt6*.so from the
          # bundle, so the AppImage only ran where Qt6 was installed.
          # linuxdeploy + linuxdeploy-plugin-qt does not share this bug.
          wget -q -O linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q -O linuxdeploy-plugin-qt \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-qt

      - name: Build AppImage
        run: |
          export QMAKE="$(which qmake6)"
          # linuxdeploy finds the "qt" plugin (linuxdeploy-plugin-qt) by
          # searching PATH for a linuxdeploy-plugin-qt executable.
          export PATH="${GITHUB_WORKSPACE}:${PATH}"

          # Deploy the shared-lib dependencies of every binary (Qt for
          # DSView-qt) without building the .AppImage yet: the Python
          # standard library and the AppRun come next.
          ./linuxdeploy --appdir "${GITHUB_WORKSPACE}/AppDir" --plugin qt \
            --desktop-file "${GITHUB_WORKSPACE}/AppDir/usr/share/applications/dsview.desktop"
          tools/package/appdir.sh "${GITHUB_WORKSPACE}/AppDir" python3

          wget -q -O appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run \
            "${GITHUB_WORKSPACE}/AppDir" DSView-x86_64.AppImage

      - name: Check the AppImage on clean systems
        run: tools/package/check-appimage.sh DSView-x86_64.AppImage ubuntu:22.04 ubuntu:26.04

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v6
        with:
          name: DSView-linux-appimage
          path: '*.AppImage'

  windows:
    name: Windows (MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            zip
            rsync
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-5compat
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkg-config

      - name: Configure
        run: |
          # Force CMake to find MSYS2's own ucrt64 Python (whose runtime DLL
          # we actually bundle below) instead of the native Windows Python
          # that's preinstalled on the windows-latest runner (e.g. python314.dll
          # under the hosted tool cache). If CMake picks that one up instead,
          # DSView.exe ends up linked against a DLL that only exists on the CI
          # runner, isn't found by the /ucrt64/bin-only dependency bundling
          # loop, and the packaged app fails to start with "python314.dll was
          # not found".
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=dsview-dist \
            -DPython3_ROOT_DIR=/ucrt64 \
            -DPython3_FIND_STRATEGY=LOCATION \
            -DPython3_FIND_REGISTRY=NEVER \
            -DPython3_FIND_VIRTUALENV=STANDARD

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Install
        run: cmake --install build

      - name: Bundle runtime DLLs
        run: |
          # Qt loads platform/image/style plugins dynamically (not visible to
          # ldd); without qwindows.dll in particular, the app can't even open
          # a window. Qt's default search looks for a "platforms" etc. folder
          # next to the executable. Copy these first so the ldd pass below
          # also picks up libraries only the plugins need (e.g. Qt6Svg.dll,
          # needed by the qsvg imageformat/iconengine plugins but not linked
          # directly by DSView.exe itself).
          for group in platforms styles imageformats iconengines; do
            mkdir -p "dsview-dist/${group}"
            cp -v /ucrt64/share/qt6/plugins/${group}/*.dll "dsview-dist/${group}/"
          done

          # DSView embeds Python (for its protocol decoders) via
          # Py_InitializeEx(); without its own copy of the standard library
          # (encodings, os.py, etc.) next to the exe, the interpreter can't
          # bootstrap once libpython3.14.dll is copied out of MSYS2's
          # /ucrt64 prefix layout, and Py_FatalError() aborts the process
          # silently before any window is shown. Bundle it under "pylib",
          # which appcontrol.cpp points PYTHONHOME at via applicationDirPath().
          PYVER="$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          mkdir -p "dsview-dist/pylib"
          rsync -a \
            --exclude 'test' --exclude 'idlelib' --exclude 'tkinter' --exclude '_tkinter*' \
            --exclude '__pycache__' \
            "/ucrt64/lib/python${PYVER}/" "dsview-dist/pylib/"

          # The install rules only place DSView.exe + data files; the MSYS2
          # toolchain/Qt6 runtime DLLs it's dynamically linked against still
          # need to be copied in manually. Resolve the dependency closure from
          # the PE import tables and keep looping until a pass copies nothing
          # new, since some transitive deps only show up once their dependents
          # are present. objdump rather than ldd, which does not read the .pyd
          # Python extension modules: they need DLLs of their own (libffi for
          # ctypes, libmpdec for decimal, ...).
          while :; do
            new=0
            for dll in $(find dsview-dist \( -name '*.exe' -o -name '*.dll' -o -name '*.pyd' \) \
                -exec objdump -p {} + | awk '/DLL Name:/ {print $3}' | sort -u); do
              if [ -f "/ucrt64/bin/$dll" ] && [ ! -f "dsview-dist/$dll" ]; then
                cp -v "/ucrt64/bin/$dll" dsview-dist/
                new=1
              fi
            done
            [ "$new" -eq 0 ] && break
          done

      - name: Package as zip
        run: |
          cd dsview-dist
          zip -r "${GITHUB_WORKSPACE}/DSView-windows-x86_64.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: DSView-windows
          path: DSView-windows-x86_64.zip

      # Native Windows shell rather than the job-default MSYS2 bash for the
      # Inno Setup steps below: iscc.exe/pnputil.exe are plain Windows tools,
      # and MSYS2 bash's automatic POSIX<->Windows path conversion is an
      # unnecessary complication for invoking them.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          # Read the app version from the workspace Cargo.toml (CMake reads it
          # there too) instead of hand-duplicating it here, so the installer's
          # version can't silently drift from the one DSView itself reports.
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(\d+\.\d+\.\d+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\windows\dsview.iss" "/DMyAppVersion=$version"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: DSView-windows-installer
          path: installer/windows/Output/DSView-windows-x86_64-setup.exe

  release:
    name: Publish latest pre-release
    needs: [linux, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only Cargo.toml is needed, to read the app version for the title.
      - name: Checkout Cargo.toml
        uses: actions/checkout@v6
        with:
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish "latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"/\1/p' Cargo.toml | head -n 1)-dev"
          gh release delete latest --yes --cleanup-tag --repo "${GITHUB_REPOSITORY}" || true
          gh release create latest artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Latest build ${version}" \
            --notes "Automated build from commit ${GITHUB_SHA}" \
            --prerelease \
            --target "${GITHUB_SHA}"
