name: Build

# DSViewR's packages: the .deb (cargo-deb) and the AppImage, both carrying
# their own Python for the protocol decoders. Linux only.

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (deb + AppImage)
    # The oldest supported Ubuntu: its Python (3.10) and glibc go into the
    # packages, which then run on newer releases too.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3-dev dpkg-dev rsync patchelf

      # The toolchain comes from rust-toolchain.toml.
      - name: Rust toolchain and cargo-deb
        run: |
          rustup show
          cargo install --locked cargo-deb

      - name: Build
        run: cargo build --release --locked -p dsview-gui -p dsview-cli

      - name: Build .deb package
        run: cargo deb -p dsview-gui --no-build

      # DSViewR embeds Python and links the exact libpythonX.Y the runner has,
      # which newer releases do not ship; the package carries that libpython
      # and its standard library in /usr/lib/dsview instead.
      - name: Bundle Python into the .deb
        run: tools/package/deb.sh target/debian/*.deb python3

      - name: Check the .deb on clean systems
        run: tools/package/check-deb.sh target/debian ubuntu:22.04 ubuntu:24.04 ubuntu:26.04

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v6
        with:
          name: DSViewR-linux-deb
          path: target/debian/*.deb

      - name: Stage the AppDir
        run: |
          rm -rf AppDir
          tools/package/stage.sh AppDir/usr

      - name: Download linuxdeploy and appimagetool
        run: |
          wget -q -O linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q -O appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x linuxdeploy appimagetool

      - name: Build AppImage
        run: |
          # the shared-library dependencies of both binaries (libpython)
          ./linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/dsviewr-cli \
            --desktop-file AppDir/usr/share/applications/dsviewr.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/dsviewr.svg
          # the Python standard library and the AppRun
          tools/package/appdir.sh AppDir python3
          ./appimagetool --appimage-extract-and-run AppDir DSViewR-x86_64.AppImage

      - name: Check the AppImage on clean systems
        run: tools/package/check-appimage.sh DSViewR-x86_64.AppImage ubuntu:22.04 ubuntu:26.04

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v6
        with:
          name: DSViewR-linux-appimage
          path: '*.AppImage'

  release:
    name: Publish latest pre-release
    needs: [linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only Cargo.toml is needed, to read the app version for the title.
      - name: Checkout Cargo.toml
        uses: actions/checkout@v6
        with:
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish "latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"/\1/p' Cargo.toml | head -n 1)-dev"
          gh release delete latest --yes --cleanup-tag --repo "${GITHUB_REPOSITORY}" || true
          gh release create latest artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "DSViewR latest build ${version}" \
            --notes "Automated build from commit ${GITHUB_SHA}" \
            --prerelease \
            --target "${GITHUB_SHA}"
